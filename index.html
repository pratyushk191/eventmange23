<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome to CampusConnect</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      color: white;
    }
    .hero h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }
    .hero p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #cbd5e1;
      max-width: 600px;
    }
    .get-started-btn {
      padding: 15px 40px;
      font-size: 18px;
      background-color: #22c55e;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: transform 0.2s;
    }
    .get-started-btn:hover {
      transform: scale(1.05);
      background-color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Welcome to CampusConnect</h1>
    <p>The unified platform for students and administrators to manage events, resources, and campus communications in one place.</p>
    
    <a href="login.html" class="get-started-btn">Enter Portal</a>
  </div>

</body>
</html>
